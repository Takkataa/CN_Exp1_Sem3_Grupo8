# Nombre de la aplicación dentro de Spring
spring.application.name=tickets-service

# Conexión a la base de datos. Los valores se leen de variables de entorno
# (DB_URL, DB_USER, DB_PASSWORD) para no dejar credenciales en el código.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# update: Hibernate crea o modifica las tablas según las entidades, sin borrar datos
spring.jpa.hibernate.ddl-auto=update
# Muestra en consola las consultas SQL que se ejecutan (útil para depurar)
spring.jpa.show-sql=true

# Carpeta base donde se guardan los PDF de los tickets.
# En local es una carpeta del proyecto; en AWS debe apuntar al punto de montaje del EFS.
efs.path=./efs-local/tickets

# Amazon S3: región y nombre del bucket donde se guardan los tickets.
# La región usa us-east-1 por defecto (la del laboratorio de AWS Academy) si no se define AWS_REGION.
# Las credenciales NO van aquí: el SDK las toma de las variables de entorno o del rol IAM de la EC2.
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket=${AWS_S3_BUCKET}
